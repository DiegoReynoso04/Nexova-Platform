# Entorno de desarrollo del monorepo con Docker (ticket #infra-40).
#
#   cp .env.example .env   # rellenar JWT_SECRET_KEY y DATABASE_URL
#   docker compose up      # website :3000 · backoffice :3001 · API :8000 (/docs)
#
# Sin secretos en este archivo: todas las variables salen del .env de la raíz
# (ignorado por git). No ejecutes `docker compose config` sin --quiet: imprime
# el entorno interpolado, con los secretos.

name: nexova

services:
  api:
    build:
      context: ./services
      additional_contexts:
        # nexova_shared e incident_analyzer: paquetes del monorepo, nunca de PyPI.
        packages: ./packages
        # Solo business_performance/trigger.py (disparo manual, librería estándar):
        # la API no instala Prefect ni el ETL (D1 y D2).
        pipelines: ./data/pipelines
    env_file:
      - path: .env
        required: true
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --reload
      # --reload-dir sustituye al directorio vigilado por defecto: van los dos.
      - --reload-dir
      - /app/api
      - --reload-dir
      - /packages
      - --reload-dir
      - /pipelines
    volumes:
      # Código de la API y de los dos paquetes del monorepo, sobre las rutas de
      # la imagen (recarga sin reconstruir). El .venv del host (Windows) no entra.
      - ./services/api/app:/app/api/app
      - ./services/telemetry:/app/api/telemetry
      - ./services/reporting:/app/api/reporting
      # Solo los dos archivos del disparo, como en la imagen.
      - ./data/pipelines/business_performance/__init__.py:/pipelines/business_performance/__init__.py
      - ./data/pipelines/business_performance/trigger.py:/pipelines/business_performance/trigger.py
      - ./packages/shared/nexova_shared:/packages/shared/nexova_shared
      - ./packages/incident-analyzer/incident_analyzer:/packages/incident-analyzer/incident_analyzer
      # TinyDB (usuarios, proveedores, incidencias): los datos de desarrollo del
      # host. Docker es el único modo de arranque, así que no hay otro uvicorn
      # escribiendo en los mismos archivos. En producción, un volumen con nombre.
      - ./services/api/data:/app/api/data
    ports:
      - "8000:8000"
    healthcheck:
      # localhost dentro de su propio contenedor (entre servicios se usa `api`).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexova

  ui:
    build:
      context: ./uis
    # Solo lo que necesitan el website y el backoffice: ningún secreto de la API.
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:?falta API_INTERNAL_URL en el .env de la raíz (ver .env.example)}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?falta NEXT_PUBLIC_API_URL en el .env de la raíz (ver .env.example)}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:?falta NEXT_PUBLIC_INVENTORY_API_URL en el .env de la raíz (ver .env.example)}
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:?falta NEXT_PUBLIC_TELEMETRY_ENDPOINT en el .env de la raíz (ver .env.example)}
      # Sondeo de cambios de Watchpack para `next dev --webpack` (uis/start.sh):
      # un bind mount desde Windows no avisa al contenedor. Comprobado en F4:
      # con este sondeo el backoffice recarga en unos 2 s, sin él no recarga.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:?falta WATCHPACK_POLLING en el .env de la raíz (ver .env.example)}
    volumes:
      # Código de las dos apps (recarga sin reconstruir).
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      # node_modules y .next del host son de Windows: volúmenes anónimos, con el
      # node_modules de Linux (musl) que instaló la imagen.
      - /app/uis/backoffice/node_modules
      - /app/uis/backoffice/.next
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexova

  # Perfil `pipelines` (D3 de docs/reporting/implementation-analysis.md): no
  # arranca con `docker compose up`, solo con `docker compose --profile
  # pipelines up`. Contra la demo, solo con la confirmación del usuario.
  prefect-server:
    profiles: [pipelines]
    build:
      context: ./data
      additional_contexts:
        # nexova_shared: paquete del monorepo, nunca de PyPI.
        packages: ./packages
    image: nexova-pipeline:dev
    # Sin env_file: el servidor de Prefect no necesita ningún secreto del .env.
    environment:
      # La UI la abre el navegador del host: sin esto, Prefect le daría
      # http://0.0.0.0:4200/api (deducida de --host).
      PREFECT_UI_API_URL: http://localhost:4200/api
      # Sin analítica anónima de Prefect: servidor y cliente (también en la imagen).
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      DO_NOT_TRACK: "1"
    command: [prefect, server, start, --host, 0.0.0.0, --port, "4200"]
    volumes:
      # Estado de Prefect (SQLite: deployments, flow runs, blocks, logs).
      - prefect-data:/root/.prefect
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexova

  # Ejecuta el flow: sirve los deployments `manual` (POST /reporting/pipeline-runs)
  # y `weekly` (cron lunes 06:00 Europe/Madrid). Ver data/pipelines/business_performance/serve.py.
  pipeline-worker:
    profiles: [pipelines]
    build:
      context: ./data
      additional_contexts:
        packages: ./packages
    image: nexova-pipeline:dev
    # Sin env_file ni DATABASE_URL: la credencial de la base vive solo en el block
    # `nexova-supabase-database-url` del servidor de Prefect (D5, §4.3 del diseño).
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      DO_NOT_TRACK: "1"
      # Caché de transform_weekly_rows (D6), en su volumen.
      PREFECT_LOCAL_STORAGE_PATH: /data/raw/business_performance/prefect-results
    command: [python, -m, business_performance.serve]
    # Si el servidor de Prefect se reinicia, `serve` termina: vuelve solo
    # (un `docker compose stop` lo sigue parando).
    restart: unless-stopped
    volumes:
      # Código del pipeline (sin el .venv ni los tests del host). El worker no
      # recarga solo: tras un cambio, `docker compose --profile pipelines restart pipeline-worker`.
      - ./data/pipelines/pipeline.py:/data/pipelines/pipeline.py
      - ./data/pipelines/business_performance:/data/pipelines/business_performance
      - ./data/process/weekly_performance.py:/data/process/weekly_performance.py
      - ./packages/shared/nexova_shared:/packages/shared/nexova_shared
      # Intermedios (caché) y snapshots de validación (D6 y D7).
      - pipeline-raw:/data/raw/business_performance
      - pipeline-eval:/data/eval/business_performance
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - nexova

networks:
  nexova:
    name: nexova-net

volumes:
  prefect-data:
  pipeline-raw:
  pipeline-eval:
