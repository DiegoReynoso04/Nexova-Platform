# Entorno de desarrollo del monorepo con Docker (ticket #infra-40).
#
#   cp .env.example .env   # rellenar JWT_SECRET_KEY y DATABASE_URL
#   docker compose up      # website :3000 · backoffice :3001 · API :8000 (/docs)
#
# Sin secretos en este archivo: todas las variables salen del .env de la raíz
# (ignorado por git). No ejecutes `docker compose config` sin --quiet: imprime
# el entorno interpolado, con los secretos.

name: nexova

services:
  api:
    build:
      context: ./services
      additional_contexts:
        # nexova_shared e incident_analyzer: paquetes del monorepo, nunca de PyPI.
        packages: ./packages
        # Solo business_performance/trigger.py (disparo manual, librería estándar):
        # la API no instala Prefect ni el ETL (D1 y D2).
        pipelines: ./data/pipelines
    env_file:
      - path: .env
        required: true
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --reload
      # --reload-dir sustituye al directorio vigilado por defecto: van los dos.
      - --reload-dir
      - /app/api
      - --reload-dir
      - /packages
      - --reload-dir
      - /pipelines
    volumes:
      # Código de la API y de los dos paquetes del monorepo, sobre las rutas de
      # la imagen (recarga sin reconstruir). El .venv del host (Windows) no entra.
      - ./services/api/app:/app/api/app
      - ./services/telemetry:/app/api/telemetry
      - ./services/reporting:/app/api/reporting
      # Solo los dos archivos del disparo, como en la imagen.
      - ./data/pipelines/business_performance/__init__.py:/pipelines/business_performance/__init__.py
      - ./data/pipelines/business_performance/trigger.py:/pipelines/business_performance/trigger.py
      - ./packages/shared/nexova_shared:/packages/shared/nexova_shared
      - ./packages/incident-analyzer/incident_analyzer:/packages/incident-analyzer/incident_analyzer
      # TinyDB (usuarios, proveedores, incidencias): los datos de desarrollo del
      # host. Docker es el único modo de arranque, así que no hay otro uvicorn
      # escribiendo en los mismos archivos. En producción, un volumen con nombre.
      - ./services/api/data:/app/api/data
    ports:
      - "8000:8000"
    healthcheck:
      # localhost dentro de su propio contenedor (entre servicios se usa `api`).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    # DEV-55: la API encola en Redis (REDIS_URL le llega por el env_file).
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexova

  ui:
    build:
      context: ./uis
    # Solo lo que necesitan el website y el backoffice: ningún secreto de la API.
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:?falta API_INTERNAL_URL en el .env de la raíz (ver .env.example)}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?falta NEXT_PUBLIC_API_URL en el .env de la raíz (ver .env.example)}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:?falta NEXT_PUBLIC_INVENTORY_API_URL en el .env de la raíz (ver .env.example)}
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:?falta NEXT_PUBLIC_TELEMETRY_ENDPOINT en el .env de la raíz (ver .env.example)}
      # Sondeo de cambios de Watchpack para `next dev --webpack` (uis/start.sh):
      # un bind mount desde Windows no avisa al contenedor. Comprobado en F4:
      # con este sondeo el backoffice recarga en unos 2 s, sin él no recarga.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:?falta WATCHPACK_POLLING en el .env de la raíz (ver .env.example)}
    volumes:
      # Código de las dos apps (recarga sin reconstruir).
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      # node_modules y .next del host son de Windows: volúmenes anónimos, con el
      # node_modules de Linux (musl) que instaló la imagen.
      - /app/uis/backoffice/node_modules
      - /app/uis/backoffice/.next
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexova

  # Cola de tareas asíncronas (DEV-55; decisiones A6 y A7 de docs/async-tasks/analysis.md).
  # Arrancan con `docker compose up`, como la API. Broker y result backend de Celery.
  redis:
    # Imagen oficial fijada por versión y digest (Redis 8.10.3, publicada el 2026-11-11).
    image: redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    # Directamente como el usuario `redis` de la imagen: con `sh -c`, su entrypoint no
    # bajaría de root. La contraseña va a un archivo de configuración dentro del
    # contenedor, no a los argumentos del proceso. noeviction con tope de 128 MB: Redis
    # rechaza escrituras antes que borrar mensajes de la cola. AOF en el volumen: la cola
    # sobrevive a un reinicio de Redis, no solo a la caída del worker.
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en el .env de la raíz (ver .env.example)}
    command:
      - sh
      - -c
      - >-
        umask 077 && printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf &&
        exec redis-server /tmp/redis-auth.conf --maxmemory 128mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    # El 6379 solo en localhost del host (tests de integración); entre contenedores, redis:6379.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # REDISCLI_AUTH: la contraseña no va en la línea de comandos de redis-cli.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nexova

  # Worker de Celery: proceso aparte de FastAPI (misma imagen que la API, otro comando).
  # Sin env_file: lista blanca. Ni JWT_SECRET_KEY, ni RESEND_API_KEY, ni
  # TELEMETRY_SUPPLIER_KEY; tampoco DATABASE_URL mientras ninguna tarea la necesite
  # (llega en la parada 2, con la DLQ). Sin puertos. No recarga solo: tras un cambio,
  # `docker compose restart worker`.
  worker:
    build: &task-queue-build
      context: ./services
      additional_contexts:
        packages: ./packages
        pipelines: ./data/pipelines
      target: api
    user: nexova
    environment:
      REDIS_URL: ${REDIS_URL:?falta REDIS_URL en el .env de la raíz (ver .env.example)}
      TZ: UTC
    command: [celery, -A, task_queue.celery_app, worker, --loglevel=INFO, "--hostname=worker@%h"]
    volumes:
      # Solo el paquete de la cola, en solo lectura, sobre la copia de la imagen.
      - ./services/task_queue:/app/api/task_queue:ro
    init: true
    restart: unless-stopped
    # Mayor que task_time_limit (150 s): la parada en caliente deja terminar la tarea en curso.
    stop_grace_period: 160s
    healthcheck:
      test: ["CMD-SHELL", "celery -A task_queue.celery_app inspect ping --destination \"worker@$$HOSTNAME\" --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexova

  # Flower (solo desarrollo): http://localhost:5555, con usuario y contraseña de
  # FLOWER_BASIC_AUTH. Lista blanca: sin DATABASE_URL.
  flower:
    build:
      <<: *task-queue-build
      target: flower
    user: nexova
    environment:
      REDIS_URL: ${REDIS_URL:?falta REDIS_URL en el .env de la raíz (ver .env.example)}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?falta FLOWER_BASIC_AUTH en el .env de la raíz (ver .env.example)}
      TZ: UTC
    volumes:
      - ./services/task_queue:/app/api/task_queue:ro
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      # /healthcheck de Flower no pide autenticación ni devuelve datos.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555/healthcheck', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexova

  # Perfil `pipelines` (D3 de docs/reporting/implementation-analysis.md): no
  # arranca con `docker compose up`, solo con `docker compose --profile
  # pipelines up`. Contra la demo, solo con la confirmación del usuario.
  prefect-server:
    profiles: [pipelines]
    build:
      context: ./data
      additional_contexts:
        # nexova_shared: paquete del monorepo, nunca de PyPI.
        packages: ./packages
    image: nexova-pipeline:dev
    # Sin env_file: el servidor de Prefect no necesita ningún secreto del .env.
    environment:
      # La UI la abre el navegador del host: sin esto, Prefect le daría
      # http://0.0.0.0:4200/api (deducida de --host).
      PREFECT_UI_API_URL: http://localhost:4200/api
      # Sin analítica anónima de Prefect: servidor y cliente (también en la imagen).
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      DO_NOT_TRACK: "1"
    command: [prefect, server, start, --host, 0.0.0.0, --port, "4200"]
    volumes:
      # Estado de Prefect (SQLite: deployments, flow runs, blocks, logs).
      - prefect-data:/root/.prefect
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexova

  # Ejecuta el flow: sirve el deployment `manual` (POST /reporting/pipeline-runs). Desde
  # DEV-53 ya no hay cron en Prefect: la programación es el servicio `nightly-scheduler`.
  # Ver data/pipelines/business_performance/serve.py.
  pipeline-worker:
    profiles: [pipelines]
    build:
      context: ./data
      additional_contexts:
        packages: ./packages
    image: nexova-pipeline:dev
    # Sin env_file ni DATABASE_URL: la credencial de la base vive solo en el block
    # `nexova-supabase-database-url` del servidor de Prefect (D5, §4.3 del diseño).
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      DO_NOT_TRACK: "1"
      # Caché de transform_weekly_rows (D6), en su volumen.
      PREFECT_LOCAL_STORAGE_PATH: /data/raw/business_performance/prefect-results
    command: [python, -m, business_performance.serve]
    # Si el servidor de Prefect se reinicia, `serve` termina: vuelve solo
    # (un `docker compose stop` lo sigue parando).
    restart: unless-stopped
    volumes:
      # Código del pipeline (sin el .venv ni los tests del host). El worker no
      # recarga solo: tras un cambio, `docker compose --profile pipelines restart pipeline-worker`.
      - ./data/pipelines/pipeline.py:/data/pipelines/pipeline.py
      - ./data/pipelines/business_performance:/data/pipelines/business_performance
      - ./data/process/weekly_performance.py:/data/process/weekly_performance.py
      - ./packages/shared/nexova_shared:/packages/shared/nexova_shared
      # Intermedios (caché) y snapshots de validación (D6 y D7).
      - pipeline-raw:/data/raw/business_performance
      - pipeline-eval:/data/eval/business_performance
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - nexova

  # Job nocturno de telemetría (DEV-53): supercronic ejecuta `scripts/nightly_export.py` a
  # las 02:00 UTC (data/nightly.crontab). Perfil `nightly`: NO arranca con `docker compose
  # up`, solo con `docker compose --profile nightly up -d nightly-scheduler`. Como
  # DATABASE_URL sale del .env de la raíz (la demo), arrancarlo así es una decisión aparte y
  # solo con la confirmación del usuario. Para probarlo contra otra base, un override que no
  # se versiona (ver docs/telemetry/nightly-export-analysis.md).
  #
  # Entorno mínimo (lista blanca, M14): solo DATABASE_URL. Sin env_file: ni JWT_SECRET_KEY,
  # ni RESEND_API_KEY, ni TELEMETRY_SUPPLIER_KEY entran en el contenedor. Sin TARGET_DATE: la
  # fecha es siempre «ayer en UTC» (para probar otra, `docker compose run -e TARGET_DATE=...`).
  # Sin puertos. Usuario no root. La imagen lleva solo el script y job_runner (sin montar código).
  nightly-scheduler:
    profiles: [nightly]
    build:
      context: ./data
      target: scheduler
      additional_contexts:
        # nexova_shared; nightly_export.py y job_runner (solo se copian esos archivos).
        packages: ./packages
        scripts: ./scripts
        services: ./services
    image: nexova-nightly-scheduler:dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en el .env de la raíz (ver .env.example)}
      TZ: UTC
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      DO_NOT_TRACK: "1"
    # Prefect lanza su servidor efímero como proceso hijo: `init` recoge los huérfanos.
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      # Los CSV (`telemetry_YYYY-MM-DD.csv`) quedan en data/raw del host (ignorados por git).
      # OJO: este montaje también expone data/raw/incidents/ (datos reales, ignorados por git)
      # dentro del contenedor, aunque el job solo escribe sus CSV y su caché.
      - ./data/raw:/data/raw
    networks:
      - nexova

networks:
  nexova:
    name: nexova-net

volumes:
  # AOF de Redis (DEV-55): la cola sobrevive a `docker compose restart redis`.
  redis-data:
  prefect-data:
  pipeline-raw:
  pipeline-eval:
